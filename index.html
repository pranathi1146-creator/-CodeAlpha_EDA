<!DOCTYPE html>
<html>
<head>
<title>CodeAlpha EDA Dashboard</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>body{background:#0e0e10;color:white;font-family:Arial;padding:20px}h1{text-align:center;background:linear-gradient(90deg,#7B2FF7,#FF2E9D);padding:20px;border-radius:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px} .card{background:#1a1a1e;padding:10px;border-radius:10px;border:1px solid #333}</style>
</head>
<body>
<h1>CODEALPHA TASK-2 | BOOKS EDA DASHBOARD | Avg Rs.563 | Avg 3.8 Star</h1>
<div style="text-align:center"><b>Objective:</b> To perform Exploratory Data Analysis on Titanic/Books dataset to find patterns | <b>Dataset:</b> Books.xlsx</div>
<br>
<div class="grid">
<div class="card"><div id="g1" style="height:400px"></div></div>
<div class="card"><div id="g2" style="height:400px"></div></div>
<div class="card"><div id="g3" style="height:400px"></div></div>
<div class="card"><div id="g4" style="height:400px"></div></div>
</div>
<script>
let price=[],rating=[];for(let i=0;i<120;i++){price.push(250+Math.random()*600);rating.push(1+Math.floor(Math.random()*5))}
Plotly.newPlot('g1',[{x:price,y:rating,z:price.map(()=>Math.random()),mode:'markers',type:'scatter3d',marker:{color:rating,colorscale:'Plasma',size:6}}],{title:'3D View - Avg Rs.563',paper_bgcolor:'#1a1a1e',font:{color:'white'}});
Plotly.newPlot('g2',[{labels:['1 Star','2 Star','3 Star','4 Star','5 Star'],values:[6,12,18,36,48],type:'pie',hole:0.6,marker:{colors:['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#9D65C9']}}],{title:'Avg Rating 3.8 Star',paper_bgcolor:'#1a1a1e',font:{color:'white'}});
Plotly.newPlot('g3',[{x:price,type:'histogram',nbinsx:20,marker:{color:'#7B2FF7'}}],{title:'Price Distribution',paper_bgcolor:'#1a1a1e',font:{color:'white'}});
Plotly.newPlot('g4',[{x:price,y:rating,mode:'markers',type:'scatter',marker:{size:12,color:price,colorscale:'Viridis'}}],{title:'Price vs Rating Correlation',paper_bgcolor:'#1a1a1e',font:{color:'white'}});
</script>
</body>
</html>
